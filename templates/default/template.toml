# ===========================================================
#  チャンネルの見た目テンプレート（初期版）
#  刷新するときは、このファイルをコピーして別フォルダで作り、
#  --template でそのフォルダを指定してください。
#  見た目の確認:  python finish.py --template-preview --template templates/default
# ===========================================================

[video]
width = 1920
height = 1080
fps = "auto"          # "auto" = 素材に合わせる / "30" "60" なども可
encoder = "auto"      # auto / h264_nvenc / hevc_nvenc / av1_nvenc / libx264
quality = 19          # 小さいほど高画質・大きいファイル（18〜23くらい）

[audio]
loudness = -14.0      # YouTubeの基準音量（LUFS）
voice_volume_db = 0
bgm_volume_db = -18   # BGMの基本音量
bgm_duck = 8          # 喋っている間にBGMを下げる強さ（大きいほど下がる）
se_volume_db = -6

[fonts]
dir = "fonts"         # ここに置いた .ttf / .otf も使えます

# ---- 字幕（画面下） ----
[caption]
font = "BIZ UDPGothic"   # Windows 10/11 に標準で入っているフォント
size = 66
bold = true
color = "#FFFFFF"
outline_color = "#1A1A1A"
outline = 6
shadow = 0
margin_bottom = 56
max_chars = 24
keyword_color = "#FFE14D"  # 字幕の中のキーワード（AIが選ぶ商品名・数字など）の色。"" にすると色を付けない

# ---- 演出のディレクター（AIが映像を見て、テロップの置き場所・強調する言葉・大きさ・出方と、ズームの中心を決める） ----
[direction]
vision = true             # false にすると、映像は見ずに、下の [telop.*] の position / animation のとおりに出す

# ---- テロップ（強調など。AIが大事な所に付ける） ----
# position / animation は、AIが映像を見て決めなかったとき（AIなし・vision = false）の初期値です
# outline2 = 外側にもう1本付ける縁取りの太さ（0 で無し）/ outline2_color = その色 / emphasis_color = 強調する言葉の色
[telop.emphasis]          # 大事なポイント（画面上部に大きく、ポンッと出る）
font = "BIZ UDPGothic"
size = 96
bold = true
color = "#FFE14D"
outline_color = "#1A1A1A"
outline = 9
outline2 = 6
outline2_color = "#FFFFFF"
emphasis_color = "#FF7A59"
position = "top"          # top / middle / top-left / top-right / left / right / bottom-left / bottom-right
animation = "pop"         # pop / fade / slide / drop / zoom / shake

[telop.info]              # 補足情報（左上に帯で出る）
font = "BIZ UDPGothic"
size = 52
bold = true
color = "#FFFFFF"
box_color = "#2B6CB0"
position = "top-left"
animation = "slide"

[telop.warning]           # 注意（赤系）
font = "BIZ UDPGothic"
size = 80
bold = true
color = "#FFFFFF"
outline_color = "#C53030"
outline = 9
outline2 = 6
outline2_color = "#FFFFFF"
emphasis_color = "#FFE14D"
position = "top"
animation = "pop"

[telop.funny]             # ツッコミ・面白い所
font = "BIZ UDPGothic"
size = 84
bold = true
color = "#FFFFFF"
outline_color = "#D53F8C"
outline = 9
outline2 = 6
outline2_color = "#FFFFFF"
emphasis_color = "#FFE14D"
position = "top"
animation = "pop"

# ---- 章タイトルのカード（チャプターの頭に出る） ----
[chapter_card]
font = "BIZ UDPGothic"
size = 88
bold = true
color = "#FFFFFF"
box_color = "#1A1A1A"
duration = 2.5
position = "top"          # top（画面の上。写っている物を隠さない）/ top-left / top-right / middle（真ん中）

# ---- ズーム（喋りの強調でグッと寄る） ----
[zoom]
small = 1.12
medium = 1.22

# ---- オープニング・エンディング・ロゴ（空なら使わない） ----
[intro]
file = ""                 # 例: "intro.mp4"（このフォルダからの相対パス）

[outro]
file = ""

[logo]
file = ""                 # 例: "logo.png"（背景透過PNG）
position = "top-right"    # top-left / top-right / bottom-left / bottom-right
width = 180
opacity = 0.85

# ---- BGM・効果音 ----
[bgm]
dir = "bgm"               # bgm/calm, bgm/upbeat, bgm/tension, bgm/emotional に曲を入れる

[se]
dir = "se"                # pop.wav / ding.wav / whoosh.wav / boing.wav

# ---- サムネイル ----
[thumbnail]
# 見せ方: elegant=上品（明朝体の白い文字に影・小さな金の見出し） / pop=ポップ（太い文字に二重のふち） / simple=シンプル（半透明の板に白い文字）
style = "elegant"
# 文字に使うフォントファイル（.ttf / .otf / .ttc）。空なら fonts フォルダ → 見せ方に合う Windows のフォントの順に探します
font_file = ""
font_index = 0              # .ttc の中の何番目のフォントか（0から数える）
# 色は空なら見せ方の色を使います（"#RRGGBB" で決めると、そちらを使います）
text_color = ""             # 文字の色
outline_color = ""          # 文字の縁取り・影の色
outer_color = ""            # ポップの外側の縁取り
accent_color = ""           # 帯・線・見出しの札の色。"auto" = 写真から選ぶ
label = true                # 大きな文字の上に、商品名などの小さな見出しを添える（AIで選んだとき）
layouts = ["bottom", "band", "side"]   # bottom=大きな文字（上か下） / band=帯（上か下） / side=横に文字（左か右） / vertical=縦書き（左か右）。文字は写真の空いている側に置きます
emphasis_color = ""         # 強調する言葉（「30g」など）の色
badge_color = ""            # バッジ（「限定」「検証」などの札）の色
art_director = true         # 強調する言葉・バッジ・写真の効果（主役の切り抜き・背景のぼかし）・見せ方の組み合わせもAIが決める。決めた組み合わせは layouts より優先
effort = "high"             # サムネイルを選ぶAIの考える深さ（high / medium / low）。動画の編集の深さとは別に決められます

# ---- 声を聞き取りやすくする（仕上げの書き出しで、声のトラックにかける） ----
[audio_clean]
enabled = true        # false にすると、声の処理をしません
strength = 1.0        # 全体の強さ（0.5=控えめ / 1.0=ふつう / 1.5=強め）
lowcut_hz = 0         # 低音カットの周波数。0 = 撮影ジャンルに合わせる（解説・工作 80Hz / 屋外 120Hz）
denoise = 1.0         # ノイズ除去（「サー」「ゴー」を減らす）の強さ。0 で使わない
deesser = 1.0         # 歯擦音（サ行の「シー」の刺さり）を抑える強さ。0 で使わない
compressor = 1.0      # 声の大きさのばらつきをならす強さ。0 で使わない
wind = "auto"         # 風切り音対策。"auto" = 屋外企画だけ / true / false

# ---- 映像の明るさ・色（仕上げの書き出しで、本編の映像にかける） ----
[color]
auto = false          # true にすると、明るさと色かぶりを自動で少し整えます
strength = 0.5        # 自動補正の強さ（0〜1。控えめが 0.5）
lut = ""              # LUT ファイル（.cube）。例: "luts/channel.cube"（このフォルダからの相対パス）
lut_strength = 1.0    # LUT のかかり具合（0〜1）
brightness = 0.0      # 明るさ（-0.5〜0.5。0 = そのまま）
contrast = 1.0        # コントラスト（1.0 = そのまま）
saturation = 1.0      # 鮮やかさ（1.0 = そのまま）
temperature = 0.0     # 色温度（+ で暖かく、- で涼しく。-1〜1）

# ---- 手ブレ補正（仕上げの書き出しで、本編の映像にかける） ----
[stabilize]
enabled = "auto"      # "auto" = 屋外企画だけ使う / true / false
strength = 0.5        # なめらかさ（0.1〜1。大きいほどゆったり動く。少し拡大されます）
method = "auto"       # auto（vidstab。無ければ deshake）/ vidstab / deshake

# ---- 工作の作業シーンの早送り（工作モードで、喋っていない作業の場面） ----
[speedup]
enabled = true            # false にすると、自動では早送りにしない
min_seconds = 6           # これより短い作業は早送りにしない（秒）
target_seconds = 10       # 早送りしたあとの長さの目安（秒）。長い作業ほど速くなります
min_speed = 2             # 早送りの倍率のはば（2〜8倍）
max_speed = 8
timelapse_over = 240      # これより長い作業で、8倍でも長すぎるときは「タイムラプス」にする（秒）
timelapse_max = 30        # タイムラプスの最大の倍率
audio = "mute"            # mute=作業の音を消してBGMだけ / fast=速くした音を小さく流す
audio_volume_db = -18     # audio = "fast" のときの音の大きさ
badge = true              # 早送り中は画面の隅に「×4」などを出す
badge_text = "▶▶ ×{speed}"           # {speed} が倍率になります
timelapse_text = "タイムラプス ×{speed}"
position = "bottom-right" # bottom-right / bottom-left / top-right / top-left
font = "BIZ UDPGothic"
size = 54
bold = true
color = "#FFFFFF"
box_color = "#1A1A1A"     # 文字の後ろの箱の色（"" にすると縁取りだけ）
outline_color = "#1A1A1A"
outline = 5
margin = 48

# ---- 縦型ショート（shorts.py / 画面の「ショートを作る」） ----
[shorts]
count = 3                   # 作る本数の上限（1〜3）
min_sec = 30                # 1本の長さ（秒）
max_sec = 60
layout = "crop"             # crop=人の顔を追いかけて縦に切り抜く / blur=横長の映像を真ん中に置き、上下はぼかした映像
zoom = 1.0                  # 1.0より大きくすると、さらに寄る（例: 1.2）
follow_smooth = 0.7         # 追いかけるなめらかさ（秒。大きいほどゆっくり動く）
follow_deadzone = 0.04      # この割合より小さい動きは追いかけない（画面がふらふらしないように）
follow_max_speed = 0.35     # 1秒に動ける量の上限（素材の幅に対する割合）
band = true                 # 上部のタイトル帯を出す
band_height = 300
band_color = "#111111"
band_opacity = 0.88         # 帯の濃さ（0〜1）
band_accent_color = "#FFE14D"   # 帯の下の線の色
band_accent_height = 10     # 線の太さ（0で線なし）
title_font = "BIZ UDPGothic"
title_size = 100            # 長いタイトルは帯に収まるように自動で小さくなります
title_color = "#FFFFFF"
title_chars_per_line = 11   # タイトルを2行に分ける目安の文字数
caption_font = "BIZ UDPGothic"
caption_size = 84           # 字幕の大きさ（縦型なので本編より大きめ）
caption_color = "#FFFFFF"
caption_outline_color = "#111111"
caption_outline = 9
caption_margin_bottom = 560 # 字幕の位置（画面の下からの距離。大きいほど中央寄り）
caption_line_chars = 11     # 字幕1行の文字数の目安（長い字幕は2行に分けます）
telops = true               # 演出プランの強調テロップも入れる
telop_size = 88
hashtags = ["shorts"]       # 説明文の最後に付けるハッシュタグ（#shorts は必ず付きます）

# ---- 2台目カメラの自動切り替え（荒編集で --cam2 を付けたときだけ使います） ----
[multicam]
auto = true               # 演出プランを作るときに、手元カメラを使う場面を自動で決める（false = 自動では切り替えない）
ai = false                # true = Claude に両カメラの静止画と発言を見せて決める（「Claude APIで自動」のときだけ。料金が少し増えます）
min_shot = 3.0            # 1つのカメラを続けて映す最短の秒数（短い切り替えはまとめます）
silence = 4.0             # この秒数以上だれも喋っていない所（作業シーン）は手元カメラにする
words = ["ここを", "ここに", "ここが", "ここの", "この部品", "このパーツ", "この部分", "このネジ", "こちらを",
         "手元", "こうやって", "こうして", "こんな感じ", "このように", "この向き"]   # この言葉を含む発言は手元カメラにする
background = "blur"       # 縦横の比率が違うとき（縦長のスマホなど）: blur = ぼかした背景で埋める / black = 黒で埋める
min_confidence = 6.0      # 音声の同期の信頼度がこれより低いときは、自動では切り替えない（手動では選べます）

# ---- Bロール（差し込み素材。発言に合わせて画像・動画を出す） ----
[broll]
folder = "broll"            # 本編の動画と同じ場所にある、この名前のフォルダの画像・動画を使う
auto = true                 # 演出プランを作るとき、素材フォルダがあれば出す場所も自動で決める
min_sec = 2.5               # 1つの素材を出す長さ（秒）の目安
max_sec = 7.0
fade = 0.25                 # 出し入れのフェード（秒）
kenburns = 1.12             # 写真をゆっくり寄せる（引く）倍率。1.0 にすると動かさない
wipe_width = 640            # ワイプ（画面の隅に小さく出す）の幅（px）
wipe_position = "top-right" # top-left / top-right / bottom-left / bottom-right
wipe_margin = 40            # 画面の端からの間隔（px）
wipe_border = 6             # ワイプのふちの太さ（px。0 でふちなし）
wipe_border_color = "#FFFFFF"

# ---- 字幕の翻訳（translate.py / 「英語字幕を作る」 / YouTube の英語字幕・英語タイトル） ----
[translate]
languages = ["en"]        # 作る言語（YouTubeの言語コード）。例: ["en", "ko", "zh-Hans", "es"]

[translate.en]            # 英語の字幕の読みやすさ（ほかの言語も [translate.ko] のように書けば変えられます）
max_line = 42             # 1行の最大文字数
lines = 2                 # 1枚の最大行数
reading_speed = 17        # 1秒に読める文字数の目安。訳が長くて読み切れないときは、次の字幕の直前まで表示を延ばす
max_extend = 1.5          # 日本語の字幕より、最大で何秒長く表示してよいか

# ---- 話者ごとの字幕の色（実験的な機能「話者の色分け」を使ったときだけ） ----
[speakers]
# 1人目（いちばん多く話している人）、2人目、3人目…の字幕の色。人数が多いときは最初の色に戻ります
colors = ["#FFFFFF", "#FFE14D", "#7FDBFF", "#FF9AA2", "#9BE59B", "#D6A8FF"]
outline_colors = ["#1A1A1A", "#1A1A1A", "#1A1A1A", "#1A1A1A", "#1A1A1A", "#1A1A1A"]
caption_name = false        # true にすると、完成動画の字幕にも名前を出す（例: 「たろう：こんにちは」）
srt_name_format = "{name}："  # 字幕に名前を入れるときの書き方（{name} が名前に置きかわる）

# ---- MVモード（mv.py / 画面の「MV」タブ） ----
[mv]
width = 1920
height = 1080
fps = "auto"          # "auto" = 素材に合わせる / "24" "30" なども可
fit = "cover"         # cover = 画面いっぱい（はみ出しは切る） / contain = 全体を入れる（黒帯）
pace = "normal"       # カットの速さ: fast = 細かめ / normal = ふつう / slow = ゆったり
markers = "beats"     # Premiereのマーカー: beats = 拍ごと / bars = 小節ごと / sections = 区間（サビなど）だけ
fade_out = 1.0        # 曲の途中で終わるとき、最後をフェードアウトする秒数
min_cut = 0.3         # これより短いカットは作らない（秒）
ai_frames = 36        # AIで並べるとき、Claudeに見せる代表フレームの最大の数
batch = 8             # 一度に書き出すカットの数（メモリが足りないときは小さく）

# ===========================================================
#  追加のテロップの種類（カード型）
#  文字の書き方: 「／」で改行、比較表は「｜」で列を区切ります
#  position: top-left / top-right / top / left / right / middle / bottom-left / bottom-right
#  animation: slide（横から）/ pop（ポンッ）/ fade（ふわっ）
#  見た目の確認:  python graphics.py --samples
# ===========================================================
[telop.bubble]            # 吹き出し（心の声・ひとこと）  例: 「なにこれ！？」
size = 60
color = "#1A1A1A"         # 文字の色
fill = "#FFFFFF"          # 吹き出しの色
border_color = "#1A1A1A"  # 縁の色
border = 5
position = "right"        # right / left / top / middle
animation = "pop"

[telop.spec]              # 商品スペックのカード  例: 「マキタ DF033D／重さ：1.2kg／価格：9,800円」
size = 44
head_size = 50            # 見出しの文字の大きさ
color = "#1A1A1A"
label_color = "#2B6CB0"   # 「重さ」などの項目名の色
head_color = "#FFFFFF"
head_fill = "#2B6CB0"     # 見出しの帯の色
fill = "#FFFFFF"          # カードの色（白地に濃い字）
line_color = "#1A1A1A"    # 行の区切りの線の色
opacity = 0.96            # カードの濃さ（1 = 透けない）
position = "right"
animation = "slide"

[telop.compare]           # 比較表  例: 「｜A社｜B社／重さ｜1.2kg｜1.5kg／価格｜1万円｜8千円」
size = 44
head_size = 46
color = "#1A1A1A"
label_color = "#2B6CB0"   # 左の列（項目名）の色
head_color = "#FFFFFF"
head_fill = "#2B6CB0"
fill = "#FFFFFF"          # 表の色（白地に濃い字）
stripe = "#EAF1F8"        # 1行おきの色
line_color = "#1A1A1A"    # 列の区切りの線の色
opacity = 0.96
position = "top"
animation = "pop"

[telop.step]              # 工作の「STEP 1」カード  例: 「STEP 2 穴をあける」（番号なしなら順に数えます）
size = 56
number_size = 76
color = "#1A1A1A"
fill = "#FFFFFF"
accent = "#FF7A00"        # 番号の四角の色
number_color = "#FFFFFF"
position = "top-left"
animation = "slide"

[telop.place]             # 屋外の場所カード  例: 「高尾山 山頂／標高599m」
size = 58
sub_size = 36             # 2行目（補足）の大きさ
color = "#FFFFFF"
sub_color = "#CFE8D8"
accent = "#2FA36B"        # 左の線とピンの色
fill = "#101820"
opacity = 0.85
position = "bottom-left"
margin_bottom = 210       # 画面の下からの距離（字幕と重ならないように）
animation = "slide"

# ---- 章の進み具合（画面の上の細いバーと、今の章の名前） ----
[progress]
enabled = false           # true にすると表示します
position = "top"          # top / bottom
height = 8                # バーの太さ
gap = 6                   # 章と章のすき間
color = "#FFE14D"         # 進んだ部分の色
track_color = "#FFFFFF"   # まだの部分の色
track_opacity = 0.35
show_title = true         # 今の章の名前を出す
title_size = 30
title_color = "#FFFFFF"
title_box = "#000000"
title_opacity = 0.55
title_format = "{title}"  # 例: "{n}/{total} {title}"（{n}=何章目 / {total}=章の数）
title_seconds = 0         # 0 = 章の間ずっと出す / 5 = 章の頭の5秒だけ出す
title_align = "left"      # 章の名前を出す側（left / right）

# ---- オープニングの自動生成（python graphics.py で作れます） ----
[opening]
enabled = false           # true にすると、[intro] の file が空のとき、自動で作ったオープニングを使います
duration = 3.0            # 秒
logo = ""                 # 空なら [logo] の画像を使います（背景透過PNGがおすすめ）
channel_name = ""         # 例: "〇〇チャンネル"
tagline = ""              # 下に小さく出す一言（空なら出さない）
background = "#101820"
background_image = ""     # 背景に使う画像（空なら background の色）
accent_color = "#FFE14D"
color = "#FFFFFF"
size = 110
tagline_size = 44
sound = ""                # ジングル（効果音）のファイル。空なら無音

# ---- エンディングの自動生成（YouTube の終了画面用） ----
[ending]
enabled = false           # true にすると、[outro] の file が空のとき、自動で作ったエンディングを使います
duration = 20             # 秒（YouTube の終了画面は最後の5〜20秒）
message = "チャンネル登録よろしくお願いします！"
sub_message = "ほかの動画もぜひ見てください"
channel_name = ""
video_boxes = 2           # 動画の枠の数（0〜2）。YouTube Studio でこの枠に動画を置きます
background = "#101820"
background_image = ""
accent_color = "#FFE14D"
color = "#FFFFFF"
size = 76
sub_size = 40
music = ""                # エンディングの曲（空なら無音）
music_volume_db = -12

# ---- サムネイルの追加デザイン（人物の切り抜き・顔で選ぶ・背景のバリエーション） ----
[thumbnail.pro]
person = true               # 人物を背景から切り抜いて大きく置き、白いフチを付けたデザイン（thumb_○_person.jpg）も作る
                            #   顔が見つからない場面・OpenCV が入っていないPCでは、自動でほかのデザインだけになります
face_pick = true            # 顔が大きく写っている・目が開いている・表情が豊かな場面を優先して選ぶ
model = "auto"              # 切り抜きのデータ: auto=初回に自動ダウンロード（約6MB）/ off=使わない（顔の位置から推定）
backgrounds = ["blur", "vivid", "burst"]   # 人物デザインの背景（案1・案2・案3の順に使う）
                            #   blur=ぼかす / vivid=鮮やかにする / burst=集中線 / dark=暗くする / color=単色
side = "auto"               # 人物を置く側: auto（映っていた側）/ left / right。文字は反対側に入ります
person_height = 0.96        # 人物の大きさ（画面の高さに対する割合）
max_zoom = 2.2              # 人物を拡大する上限（大きくしすぎてぼやけないように）
outline = 12                # 白いフチの太さ（0 でフチなし）
outline_color = "#FFFFFF"   # フチの色
shadow = true               # 人物の後ろに影を付ける
burst_color = ""            # 集中線・単色の背景の色（空なら上の accent_color）
other_background = "none"   # ほかのデザイン（bottom/band/side）も、人物はそのままで背景だけ変える: none / blur / vivid / dark
save_cutout = true          # 切り抜いた人物を透過PNG（cutout_○.png）でも保存する（Photoshop などで使えます）
