# ===========================================================
#  チャンネルの見た目テンプレート（初期版）
#  刷新するときは、このファイルをコピーして別フォルダで作り、
#  --template でそのフォルダを指定してください。
#  見た目の確認:  python finish.py --template-preview --template templates/default
# ===========================================================

[video]
width = 1920
height = 1080
fps = "auto"          # "auto" = 素材に合わせる / "30" "60" なども可
encoder = "auto"      # auto / h264_nvenc / hevc_nvenc / av1_nvenc / libx264
quality = 19          # 小さいほど高画質・大きいファイル（18〜23くらい）

[audio]
loudness = -14.0      # YouTubeの基準音量（LUFS）
voice_volume_db = 0
bgm_volume_db = -18   # BGMの基本音量
bgm_duck = 8          # 喋っている間にBGMを下げる強さ（大きいほど下がる）
se_volume_db = -6

[fonts]
dir = "fonts"         # ここに置いた .ttf / .otf も使えます

# ---- 字幕（画面下） ----
[caption]
font = "BIZ UDPGothic"   # Windows 10/11 に標準で入っているフォント
size = 66
bold = true
color = "#FFFFFF"
outline_color = "#1A1A1A"
outline = 6
shadow = 0
margin_bottom = 56
max_chars = 24

# ---- テロップ（強調など。AIが大事な所に付ける） ----
[telop.emphasis]          # 大事なポイント（画面上部に大きく、ポンッと出る）
font = "BIZ UDPGothic"
size = 96
bold = true
color = "#FFE14D"
outline_color = "#1A1A1A"
outline = 9
position = "top"          # top / middle / top-left
animation = "pop"         # pop / fade / slide

[telop.info]              # 補足情報（左上に帯で出る）
font = "BIZ UDPGothic"
size = 52
bold = true
color = "#FFFFFF"
box_color = "#2B6CB0"
position = "top-left"
animation = "slide"

[telop.warning]           # 注意（赤系）
font = "BIZ UDPGothic"
size = 80
bold = true
color = "#FFFFFF"
outline_color = "#C53030"
outline = 9
position = "top"
animation = "pop"

[telop.funny]             # ツッコミ・面白い所
font = "BIZ UDPGothic"
size = 84
bold = true
color = "#FFFFFF"
outline_color = "#D53F8C"
outline = 9
position = "top"
animation = "pop"

# ---- 章タイトルのカード（チャプターの頭に出る） ----
[chapter_card]
font = "BIZ UDPGothic"
size = 88
bold = true
color = "#FFFFFF"
box_color = "#1A1A1A"
duration = 2.5

# ---- ズーム（喋りの強調でグッと寄る） ----
[zoom]
small = 1.12
medium = 1.22

# ---- オープニング・エンディング・ロゴ（空なら使わない） ----
[intro]
file = ""                 # 例: "intro.mp4"（このフォルダからの相対パス）

[outro]
file = ""

[logo]
file = ""                 # 例: "logo.png"（背景透過PNG）
position = "top-right"    # top-left / top-right / bottom-left / bottom-right
width = 180
opacity = 0.85

# ---- BGM・効果音 ----
[bgm]
dir = "bgm"               # bgm/calm, bgm/upbeat, bgm/tension, bgm/emotional に曲を入れる

[se]
dir = "se"                # pop.wav / ding.wav / whoosh.wav / boing.wav

# ---- サムネイル ----
[thumbnail]
# 文字に使うフォントファイル（.ttf / .otf / .ttc）。空なら fonts フォルダ → Windows標準の太字フォントの順に探します
font_file = "C:/Windows/Fonts/BIZ-UDGothicB.ttc"
font_index = 1              # .ttc の中の何番目のフォントか（BIZ-UDGothicB.ttc は 1 = BIZ UDPゴシック 太字）
text_color = "#FFE14D"      # 文字の色
outline_color = "#111111"   # 文字の縁取り（内側）
outer_color = "#FFFFFF"     # 文字の縁取り（外側）
accent_color = "#2B6CB0"    # 帯の色（「上に帯」のデザイン）
layouts = ["bottom", "band", "side"]   # bottom=下に大きな文字 / band=上に帯 / side=横に文字

# ---- 声を聞き取りやすくする（仕上げの書き出しで、声のトラックにかける） ----
[audio_clean]
enabled = true        # false にすると、声の処理をしません
strength = 1.0        # 全体の強さ（0.5=控えめ / 1.0=ふつう / 1.5=強め）
lowcut_hz = 0         # 低音カットの周波数。0 = 撮影ジャンルに合わせる（解説・工作 80Hz / 屋外 120Hz）
denoise = 1.0         # ノイズ除去（「サー」「ゴー」を減らす）の強さ。0 で使わない
deesser = 1.0         # 歯擦音（サ行の「シー」の刺さり）を抑える強さ。0 で使わない
compressor = 1.0      # 声の大きさのばらつきをならす強さ。0 で使わない
wind = "auto"         # 風切り音対策。"auto" = 屋外企画だけ / true / false

# ---- 映像の明るさ・色（仕上げの書き出しで、本編の映像にかける） ----
[color]
auto = false          # true にすると、明るさと色かぶりを自動で少し整えます
strength = 0.5        # 自動補正の強さ（0〜1。控えめが 0.5）
lut = ""              # LUT ファイル（.cube）。例: "luts/channel.cube"（このフォルダからの相対パス）
lut_strength = 1.0    # LUT のかかり具合（0〜1）
brightness = 0.0      # 明るさ（-0.5〜0.5。0 = そのまま）
contrast = 1.0        # コントラスト（1.0 = そのまま）
saturation = 1.0      # 鮮やかさ（1.0 = そのまま）
temperature = 0.0     # 色温度（+ で暖かく、- で涼しく。-1〜1）

# ---- 手ブレ補正（仕上げの書き出しで、本編の映像にかける） ----
[stabilize]
enabled = "auto"      # "auto" = 屋外企画だけ使う / true / false
strength = 0.5        # なめらかさ（0.1〜1。大きいほどゆったり動く。少し拡大されます）
method = "auto"       # auto（vidstab。無ければ deshake）/ vidstab / deshake
